# =========================================================
# YOLO-O³-v2 : Ultralytics-compatible
# =========================================================

nc: 3
scales:
  n: [0.33, 0.50, 512]

# ---------------------------------------------------------
# Backbone
# ---------------------------------------------------------
backbone:
  - [-1, 1, DWConv, [64, 3, 2]]          # 0
  - [-1, 1, DWConv, [128, 3, 2]]         # 1
  - [-1, 2, C2f, [128, True]]            # 2

  - [-1, 1, DWConv, [256, 3, 2]]         # 3
  - [-1, 3, C2f, [256, True]]            # 4 (P3)

  - [-1, 1, DWConv, [512, 3, 2]]         # 5
  - [-1, 3, C2f, [512, True]]            # 6 (P4)

  - [-1, 1, DWConv, [512, 3, 2]]         # 7
  - [-1, 1, C2f, [512, True]]            # 8 (P5)

  - [-1, 1, SPPF, [512, 5]]               # 9

# ---------------------------------------------------------
# Head  (NECK + DETECT)
# ---------------------------------------------------------
head:
  # P5 → P4
  - [-1, 1, Conv, [256, 1, 1]]            # 10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]             # 12
  - [-1, 3, C2f, [256, False]]             # 13

  # P4 → P3
  - [-1, 1, Conv, [128, 1, 1]]            # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]             # 16
  - [-1, 3, C2f, [128, False]]             # 17 (P3)

  # Down path
  - [-1, 1, Conv, [128, 3, 2]]            # 18
  - [[-1, 12], 1, Concat, [1]]             # 19
  - [-1, 3, C2f, [256, False]]             # 20 (P4)

  - [-1, 1, Conv, [256, 3, 2]]            # 21
  - [[-1, 9], 1, Concat, [1]]              # 22
  - [-1, 1, C2f, [512, False]]             # 23 (P5)

  # Detect
  - [[17, 20, 23], 1, Detect, [nc]]
