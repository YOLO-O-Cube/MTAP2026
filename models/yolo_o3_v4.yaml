# =========================================================
# YOLO-O³ v4 - Final architecture
# =========================================================
# design:
#   - YOLOv8n-derived lightweight backbone
#   - DWConv stem
#   - C2f-Light-style reduced-depth blocks
#   - uniform channel scaling alpha = 0.50
#   - lightweight spatial refinement (replaced at runtime by train_yolo_o3_v4.py)
#   - P3/P4/P5 multi-scale representation
#   - fixed weighted fusion: 0.50 P3 + 0.30 P4 + 0.20 P5
#   - decoupled YOLOv8-style Detect head, nc = 3
#
# NOTE:
# Ultralytics YAML parsing cannot express element-wise attention or a fixed
# weighted sum directly. CBAM and the 1x1 Conv below are architecture-safe
# placeholders. train_yolo_o3_v4.py replaces them at runtime with the exact
# lightweight spatial-attention and fixed-weight fusion operations described
# in the manuscript. The fusion weights are NOT learned.
# =========================================================

task: detect
nc: 3
scale: o3
scales:
  o3: [0.33, 0.50, 512]

# ---------------------------------------------------------
# Backbone: alpha = 0.50 channel scaling
# ---------------------------------------------------------
backbone:
  # input -> 32 -> 64
  - [-1, 1, DWConv, [64, 3, 2]]             # 0  DWConv stem
  - [-1, 1, DWConv, [128, 3, 2]]            # 1
  - [-1, 1, C2f, [128, False]]              # 2  C2f-Light

  # P3: 80x80 at imgsz=640
  - [-1, 1, DWConv, [256, 3, 2]]             # 3
  - [-1, 1, C2f, [256, False]]              # 4  P3
  - [-1, 1, C2f, [256, False]]              # 5  spatial-refinement placeholder

  # P4: 40x40
  - [-1, 1, DWConv, [512, 3, 2]]             # 6
  - [-1, 2, C2f, [512, False]]              # 7  P4
  - [-1, 1, C2f, [512, False]]              # 8  spatial-refinement placeholder

  # P5: 20x20
  - [-1, 1, DWConv, [1024, 3, 2]]            # 9
  - [-1, 1, C2f, [1024, False]]             # 10 P5
  - [-1, 1, SPPF, [1024, 5]]                # 11
  - [-1, 1, C2f, [1024, False]]             # 12 spatial-refinement placeholder

# ---------------------------------------------------------
# Neck: project P3/P4/P5 to a common lightweight width,
# upsample to P3 resolution, then fixed weighted fusion.
# ---------------------------------------------------------
head:
  # P3 -> common fusion width
  - [5, 1, Conv, [256, 1, 1]]               # 13 P3_proj

  # P4 -> common width -> 80x80
  - [8, 1, Conv, [256, 1, 1]]               # 14 P4_proj
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15

  # P5 -> common width -> 80x80
  - [12, 1, Conv, [256, 1, 1]]              # 16 P5_proj
  - [-1, 1, nn.Upsample, [None, 4, "nearest"]] # 17

  # Concatenate only to provide a parser-safe placeholder for the
  # runtime FixedWeightedFusion(0.50, 0.30, 0.20).
  - [[13, 15, 17], 1, Concat, [1]]          # 18 [P3,P4,P5]
  - [-1, 1, Conv, [256, 1, 1]]              # 19 fixed-fusion placeholder

  # Lightweight decoupled detection refinement.
  - [-1, 1, C2f, [256, False]]              # 20
  - [-1, 1, Conv, [256, 3, 1]]              # 21

  # Single fused feature map is used by the anchor-free Detect head.
  - [[21], 1, Detect, [nc]]
