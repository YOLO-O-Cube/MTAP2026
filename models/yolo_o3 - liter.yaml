# YOLO-O³: Orchard-Optimized YOLO (FINAL, YAML-SAFE)

nc: 3  # flower, green orange, orange

scales:
  o3: [0.33, 0.25, 1024]  # YOLOv8n-equivalent scale

# ---------------- BACKBONE ----------------
backbone:
  # Depthwise stem
  - [-1, 1, DWConv, [64, 3, 2]]       # 0 - P1/2
  - [-1, 1, Conv,   [128, 3, 2]]      # 1 - P2/4
  - [-1, 3, C2f,    [128, True]]      # 2

  - [-1, 1, Conv,   [256, 3, 2]]      # 3 - P3/8
  - [-1, 6, C2f,    [256, True]]      # 4

  # --- Lightweight spatial attention (SAFE) ---
  - [-1, 1, Conv, [256, 1, 1]]        # 5 (attention map)
  - [-1, 1, nn.Sigmoid, []]           # 6
  - [-2, 1, Conv, [256, 1, 1]]        # 7 (reweighted features)

  - [-1, 1, Conv,   [512, 3, 2]]      # 8 - P4/16
  - [-1, 6, C2f,    [512, True]]      # 9

  - [-1, 1, Conv, [512, 1, 1]]        # 10
  - [-1, 1, nn.Sigmoid, []]           # 11
  - [-2, 1, Conv, [512, 1, 1]]        # 12

  - [-1, 1, Conv,   [1024, 3, 2]]     # 13 - P5/32
  - [-1, 3, C2f,    [1024, True]]     # 14

  - [-1, 1, Conv, [1024, 1, 1]]       # 15
  - [-1, 1, nn.Sigmoid, []]           # 16
  - [-2, 1, Conv, [1024, 1, 1]]       # 17

  - [-1, 1, SPPF,   [1024, 5]]        # 18

# ---------------- NECK (PAN/FPN, STABLE) ----------------
head:
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19
  - [[-1, 12], 1, Concat, [1]]                  # 20
  - [-1, 3, C2f, [512]]                         # 21

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 22
  - [[-1, 7], 1, Concat, [1]]                   # 23
  - [-1, 3, C2f, [256]]                         # 24 (flowers)

  # Back down
  - [-1, 1, Conv, [256, 3, 2]]                  # 25
  - [[-1, 21], 1, Concat, [1]]                  # 26
  - [-1, 3, C2f, [512]]                         # 27

  - [-1, 1, Conv, [512, 3, 2]]                  # 28
  - [[-1, 18], 1, Concat, [1]]                  # 29
  - [-1, 3, C2f, [1024]]                        # 30

  # Detect (anchor-free, decoupled)
  - [[24, 27, 30], 1, Detect, [nc]]              # 31
