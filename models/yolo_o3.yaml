# YOLO-O³: Orange Orchard–Optimized YOLOv8n
# Derived from YOLOv8n with lightweight backbone & head
# yolo detect train model=models/yolo_o3.yaml data=configs/orangefruitnet.yaml cfg=configs/yolo_o3_train.yaml


nc: 3  # flower, green orange, orange

scales:
  n: [0.33, 0.25, 512]   # reduced max_channels for edge efficiency

# ------------------------
# Backbone
# ------------------------
backbone:
  # [from, repeats, module, args]

  # Depthwise-separable stem
  - [-1, 1, DWConv, [32, 3, 2]]   # P1/2
  - [-1, 1, DWConv, [64, 3, 2]]   # P2/4

  # Lightweight C2f blocks with reduced channels
  - [-1, 2, C2f, [64, True]]

  - [-1, 1, DWConv, [128, 3, 2]]  # P3/8
  - [-1, 3, C2f, [128, True]]

  - [-1, 1, DWConv, [256, 3, 2]]  # P4/16
  - [-1, 3, C2f, [256, True]]

  - [-1, 1, DWConv, [384, 3, 2]]  # P5/32
  - [-1, 2, C2f, [384, True]]

  - [-1, 1, SPPF, [384, 5]]

# ------------------------
# Head (original YOLOv8 neck preserved)
# ------------------------
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2f, [256]]

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2f, [128]]   # small fruit emphasis

  # P3 -> P4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C2f, [256]]

  # P4 -> P5
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C2f, [384]]

  # Detection head
  - [[15, 18, 21], 1, Detect, [nc]]


