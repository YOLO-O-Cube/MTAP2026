# =========================================================
# YOLO-O³ v4 - training configuration
# =========================================================
task: detect
mode: train

# -----------------------------
# DATA & MODEL
# -----------------------------
data: configs/orangefruitnet.yaml
model: models/yolo_o3_v4.yaml
pretrained: True

# -----------------------------
# TRAINING CONFIGURATION
# -----------------------------
epochs: 300
batch: 16
imgsz: 640

optimizer: SGD
lr0: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: True

# -----------------------------
# YOLO-O³ DESIGN PARAMETERS
# -----------------------------
# alpha: uniform backbone/head channel scaling
# beta: lightweight classification-branch scaling
alpha: 0.50
beta: 0.50

# Fixed normalized P3/P4/P5 fusion weights.
# These are implemented as NON-LEARNED weights by the Python training script.
fusion_weights: [0.50, 0.30, 0.20]

# -----------------------------
# DETECTION LOSSES
# standard YOLOv8-style detection losses.
# -----------------------------
box: 7.5
cls: 1.0
dfl: 1.5

# Auxiliary counting loss is intentionally absent.

# -----------------------------
# AUGMENTATION
# Applied only to training samples.
# -----------------------------
augment: True
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
fliplr: 0.5
translate: 0.1
scale: 0.5
degrees: 0.0
shear: 0.0
perspective: 0.0
erasing: 0.4
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# -----------------------------
# VALIDATION / REPRODUCIBILITY
# -----------------------------
val: True
plots: True
patience: 100
workers: 8

# GPU used for the main experiment.
device: 0
